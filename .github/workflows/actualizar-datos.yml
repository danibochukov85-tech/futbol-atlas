name: Actualizar datos de Futbol Atlas

on:
  schedule:
    - cron: '0,45 0,3,6,9,12,15,18,21 * * *'
    - cron: '30 1,4,7,10,13,16,19,22 * * *'
    - cron: '15 2,5,8,11,14,17,20,23 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: futbol-atlas-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actualizar partidos
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
        run: python scripts/actualizar.py
      - name: Guardar datos actualizados
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar datos de partidos'
            git push
          fi
